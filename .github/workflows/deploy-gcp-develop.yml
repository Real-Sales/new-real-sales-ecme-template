# Deploy this Vite/React app to a GCP Compute Engine VM on push to `develop`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GCP_VM_HOST       — VM external IP or hostname
#   GCP_VM_USER       — SSH user (e.g. vipul)
#   GCP_VM_SSH_KEY    — Private key for that user (full PEM, including headers)
#
# Optional repository variables (Settings → Variables → Actions):
#   GCP_DEPLOY_PATH    — App directory on the VM (clone this repo here once)
#   GCP_SYSTEMD_UNIT   — If set, restart this unit after build (e.g. nginx when you need
#                        `reload` after config edits). Leave unset for static-only deploys:
#                        nginx serves `build/` from disk and picks up new files immediately.
#
# On the VM:
#   - Install Node.js LTS + npm (build runs on the VM). SSH runs a non-interactive shell,
#     so ~/.bashrc is not loaded; this workflow sources nvm/fnm/asdf when present. If you
#     use apt/nodejs only, ensure npm is on PATH (e.g. /usr/bin/npm).
#   - Clone this repo once, copy `.env` with production `VITE_*` values (build embeds them).
#   - Point nginx `root` at this repo’s `build/` (Vite `outDir`). No frontend systemd unit
#     is required—only `realsales-backend` for the API is typical.
#   - If GCP_SYSTEMD_UNIT is set, the deploy user needs: sudo systemctl restart <that unit>.

name: Deploy to GCP VM (develop)

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-develop-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.GCP_DEPLOY_PATH }}
      SYSTEMD_UNIT: ${{ vars.GCP_SYSTEMD_UNIT }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_PATH,SYSTEMD_UNIT
          script: |
            set -euo pipefail
            # Non-interactive SSH does not source ~/.bashrc; load common Node version managers.
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.nvm/nvm.sh" ]; then
                . "$HOME/.nvm/nvm.sh"
              elif [ -s "/usr/local/opt/nvm/nvm.sh" ]; then
                . "/usr/local/opt/nvm/nvm.sh"
              fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.asdf/asdf.sh" ]; then
                . "$HOME/.asdf/asdf.sh"
              fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if command -v fnm >/dev/null 2>&1; then
                eval "$(fnm env)"
              elif [ -x "$HOME/.local/share/fnm/fnm" ]; then
                eval "$("$HOME/.local/share/fnm/fnm" env)"
              fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              echo "npm not found. Install Node.js LTS for this SSH user (apt/chromium snap), or nvm: curl ... | bash && source ~/.nvm/nvm.sh && nvm install --lts" >&2
              exit 127
            fi
            APP="${DEPLOY_PATH:-/home/RealSales/frontend/new-real-sales-ecme-template}"
            cd "$APP"
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            npm ci
            npm run build
            if [ -n "${SYSTEMD_UNIT:-}" ]; then
              sudo systemctl restart "$SYSTEMD_UNIT"
              sudo systemctl is-active "$SYSTEMD_UNIT"
            fi
